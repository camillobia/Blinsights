# Blueprint do Render: cria a API Spring e o serviço Python de uma vez.
# Render > New > Blueprint > selecione este repositório.
# Variáveis com "sync: false" são pedidas no painel (nunca ficam no Git).
services:
  - type: web
    name: blinsights-api
    runtime: docker
    rootDir: SYNAPSE/BackEnd
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ETL_URL
        sync: false
      - key: ETL_API_KEY
        sync: false

  - type: web
    name: blinsights-etl
    runtime: python
    rootDir: SYNAPSE/CienciaD/analytics-python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: ETL_API_KEY
        sync: false
