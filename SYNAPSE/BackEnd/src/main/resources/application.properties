spring.config.import=optional:file:.env[.properties]
spring.application.name=blinsights-api

# ---- Servidor ----
# O Render (e a maioria das nuvens) informa a porta pela variável PORT.
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Banco PostgreSQL (Neon ou Azure) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Neon gratuito limita conexões e suspende o banco ocioso.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=240000

# ---- JPA ----
# As tabelas vêm do schema.sql; o Hibernate não cria nem altera nada.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Criação das tabelas ao iniciar (schema.sql é idempotente) ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
